<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案例研究｜Jason 作品集</title>
<meta name="description" content="Jason 作品集的案例研究：問題定義、系統架構、技術重點、關鍵決策與 PM 力展現。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --card:#111c30; --card2:#0e1830; --border:#1e2c44; --border2:#2c4061;
  --text:#e6edf7; --text2:#9fb2cc; --text3:#6b809e; --accent:#3b82f6; --accent2:#22d3ee; --gold:#f59e0b;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}

/* 頂部導覽 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 5%;background:rgba(11,18,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.tb-back{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.tb-back:hover{color:var(--accent)}
.tb-title{font-size:13px;font-weight:800;color:#fff}
.tb-badge{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--gold);
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);border-radius:20px;padding:2px 9px}

/* 案例切換 */
.docnav{display:flex;gap:7px;overflow-x:auto;padding:12px 5% 0;scrollbar-width:thin}
.docnav a{font-size:11.5px;font-weight:600;color:var(--text2);background:var(--card2);
  border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap;transition:.15s}
.docnav a:hover{border-color:var(--border2);color:var(--text)}
.docnav a.on{color:#052e16;background:#4ade80;border-color:#4ade80}

/* 文章本體 */
.wrap{max-width:840px;margin:0 auto;padding:26px 5% 90px}
#doc h1{font-size:clamp(1.5rem,4.4vw,2.05rem);font-weight:900;line-height:1.3;color:#fff;
  margin:6px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
#doc h2{font-size:1.18rem;font-weight:800;color:#fff;margin:34px 0 12px;
  display:flex;align-items:center;gap:11px}
#doc h2::before{content:"";width:4px;height:17px;background:var(--accent);border-radius:2px;flex:0 0 auto}
#doc h3{font-size:1.04rem;font-weight:800;color:var(--accent2);margin:30px 0 10px;
  padding-top:14px;border-top:1px dashed var(--border)}
#doc h3:first-of-type{border-top:0;padding-top:0}
#doc p{margin:0 0 14px;color:var(--text2);font-size:15px}
#doc p strong,#doc li strong{color:var(--text);font-weight:700}
#doc ul,#doc ol{margin:0 0 16px;padding-left:4px;list-style:none}
#doc ol{counter-reset:li}
#doc li{position:relative;color:var(--text2);font-size:14.5px;margin-bottom:9px;padding-left:20px}
#doc ul>li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;
  border-radius:50%;background:var(--border2)}
#doc ol>li{counter-increment:li}
#doc ol>li::before{content:counter(li) ".";position:absolute;left:0;top:0;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
#doc code{font-family:var(--mono);font-size:.86em;color:var(--accent2);
  background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
#doc blockquote{margin:0 0 16px;padding:11px 15px;background:var(--card2);
  border-left:3px solid var(--gold);border-radius:0 8px 8px 0;color:var(--text2);font-size:14px}
#doc blockquote p{margin:0}
#doc .tbl-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--border);border-radius:9px}
#doc table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
#doc th{background:#111f35;color:var(--text3);font-size:10.5px;font-weight:700;letter-spacing:.4px;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
#doc td{padding:9px 12px;color:var(--text2);border-bottom:1px solid rgba(30,44,68,.6);vertical-align:top}
#doc tr:last-child td{border-bottom:0}
#doc tbody tr:hover td{background:rgba(59,130,246,.05)}
#doc hr{border:0;border-top:1px solid var(--border);margin:26px 0}

.state{color:var(--text3);font-size:14px;padding:30px 0}
.state b{color:var(--text)}
.footnav{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
.footnav a{font-size:13px;font-weight:700}
@media(max-width:640px){
  .wrap{padding:20px 18px 70px}
  #doc h2{margin-top:28px}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="tb-back" href="index.html">← 作品集首頁</a>
  <span class="tb-title">案例研究</span>
  <span class="tb-badge">CASE STUDY</span>
</div>

<nav class="docnav" id="docnav" aria-label="案例研究清單"></nav>

<div class="wrap">
  <article id="doc"><p class="state">載入中…</p></article>
  <div class="footnav">
    <a href="index.html">← 回作品集首頁</a>
    <a href="index-pm.html">PM 版作品集 →</a>
  </div>
</div>

<script>
/* 只允許白名單內的案例檔，避免用網址參數去取任意路徑的檔案 */
var DOCS = [
  { id: "01-j1-product-copy", name: "J1 商品文案自動化" },
  { id: "02-ops-automation",  name: "營運流程自動化" },
  { id: "03-shopify-ops",     name: "Shopify 上架 SEO/GEO" },
  { id: "04-ga4-dashboard",   name: "GA4 / GSC 儀表板" },
  { id: "05-stock-sentiment", name: "台股輿情日報" },
  { id: "06-line-rag",        name: "LINE RAG 客服" }
];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
/* 行內語法：先轉義 HTML，再處理粗體／斜體／行內碼／連結 */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function isTableDivider(line) { return /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(line.trim()); }
function cells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
}

function mdToHtml(md) {
  var lines = md.replace(/\r\n?/g, "\n").split("\n");
  var out = [], i = 0;
  while (i < lines.length) {
    var line = lines[i];

    if (!line.trim()) { i++; continue; }

    /* 表格：表頭 + 分隔列 + 內容列 */
    if (line.trim().indexOf("|") === 0 && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
      var head = cells(line), rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim().indexOf("|") === 0) { rows.push(cells(lines[i])); i++; }
      out.push('<div class="tbl-wrap"><table><thead><tr>' +
        head.map(function (h) { return "<th>" + inline(h) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        rows.map(function (r) {
          return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>");
      continue;
    }

    /* 標題 */
    var h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      var lv = Math.min(h[1].length, 3);
      out.push("<h" + lv + ">" + inline(h[2]) + "</h" + lv + ">");
      i++; continue;
    }

    /* 分隔線 */
    if (/^\s*([-*_]\s*){3,}$/.test(line)) { out.push("<hr>"); i++; continue; }

    /* 引言 */
    if (/^\s*>/.test(line)) {
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote><p>" + q.map(inline).join("<br>") + "</p></blockquote>");
      continue;
    }

    /* 清單（含續行縮排） */
    var li = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (li) {
      var ordered = /\d/.test(li[2]), items = [];
      while (i < lines.length) {
        var m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]);
        if (m && (/\d/.test(m[2]) === ordered)) { items.push(m[3]); i++; }
        else if (lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && items.length) {
          items[items.length - 1] += " " + lines[i].trim(); i++;
        } else break;
      }
      var tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</" + tag + ">");
      continue;
    }

    /* 段落 */
    var p = [];
    while (i < lines.length && lines[i].trim() &&
           !/^(#{1,4})\s/.test(lines[i]) && !/^\s*>/.test(lines[i]) &&
           !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i]) && lines[i].trim().indexOf("|") !== 0) {
      p.push(lines[i].trim()); i++;
    }
    if (p.length) out.push("<p>" + p.map(inline).join(" ") + "</p>");
  }
  return out.join("\n");
}

function currentId() {
  var q = new URLSearchParams(location.search).get("doc") || "";
  return DOCS.some(function (d) { return d.id === q; }) ? q : DOCS[0].id;
}

function renderNav(id) {
  document.getElementById("docnav").innerHTML = DOCS.map(function (d) {
    return '<a href="?doc=' + d.id + '"' + (d.id === id ? ' class="on" aria-current="page"' : "") + ">" + d.name + "</a>";
  }).join("");
}

(function () {
  var id = currentId(), doc = document.getElementById("doc");
  renderNav(id);
  var meta = DOCS.filter(function (d) { return d.id === id; })[0];
  document.title = meta.name + "｜案例研究 — Jason 作品集";

  fetch("case-studies/" + id + ".md")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (md) { doc.innerHTML = mdToHtml(md); })
    .catch(function (e) {
      doc.innerHTML = '<p class="state">案例文件載入失敗（<b>' + esc(String(e.message)) +
        '</b>）。可直接開啟原始檔：<a href="case-studies/' + id + '.md">' + id + '.md</a></p>';
    });
})();
</script>
</body>
</html>
